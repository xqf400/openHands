<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hallo XQF</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: rgba(17, 24, 39, 0.78);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #7c3aed;
      --accent-2: #22d3ee;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(124, 58, 237, 0.35), transparent 35%),
        radial-gradient(circle at bottom right, rgba(34, 211, 238, 0.2), transparent 25%),
        linear-gradient(135deg, #050816 0%, var(--bg) 100%);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(720px, 100%);
      padding: 56px 40px;
      text-align: center;
      background: var(--panel);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(14px);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
      background: linear-gradient(90deg, #fff, var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      margin: 0 auto;
      max-width: 60ch;
      font-size: 1.1rem;
      line-height: 1.7;
      color: var(--muted);
    }

    .badge {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(124, 58, 237, 0.16);
      color: #ddd6fe;
      border: 1px solid rgba(124, 58, 237, 0.28);
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Modern • Dark Theme • Welcome</div>
    <h1>Hallo XQF</h1>
    <p>
      Stuttgart ist eine lebendige Stadt im Süden Deutschlands, bekannt für ihre
      Mischung aus Innovation, Kultur und Natur. Zwischen Weinbergen, moderner Architektur
      und traditionsreicher Geschichte entsteht hier ein ganz eigener Charme.
    </p>
  </main>
</body>
</html>
